    <h1>刪除習慣冒險島帳號與資料</h1>
    <p>如果你已安裝習慣冒險島，請登入家長帳號，在「設定 → 刪除帳號與資料」完成刪除。這會刪除家長帳號、家庭、孩子帳號、任務、心得、獎勵、點數與兌換紀錄。</p>
    <p>如果你無法登入，請使用下方 Email 提出刪除請求。我們會驗證家長帳號後處理：</p>
